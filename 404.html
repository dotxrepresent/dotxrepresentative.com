<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | DotX Representative</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080808;color:#f5f5f2;font-family:'DM Mono',monospace;padding:24px}
.box{max-width:520px;text-align:center}
.box img{height:56px;width:auto;margin-bottom:28px}
.code{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(245,245,242,.45);margin-bottom:14px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:600;margin-bottom:14px}
p{color:rgba(245,245,242,.6);line-height:1.8;font-size:.95rem;margin-bottom:28px}
a.btn{display:inline-block;padding:.8rem 1.6rem;border:1px solid #f5f5f2;color:#f5f5f2;text-decoration:none;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
a.btn:hover{background:#f5f5f2;color:#080808}
</style>
</head>
<body>
<div class="box">
  <img src="/dotx-logo-circle.png" alt="dot.x">
  <p class="code">Error 404</p>
  <h1>Page not found</h1>
  <p>The page you are looking for has moved or no longer exists.</p>
  <a class="btn" href="/">Back to dot.x</a>
</div>
</body>
</html>
